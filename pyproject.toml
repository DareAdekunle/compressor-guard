[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compressor-guard"
version = "0.1.0"
description = "Predictive maintenance for industrial compressors: MetroPT-3 telemetry anomaly detection and IMS bearing degradation tracking."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Oludare Adekunle"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
